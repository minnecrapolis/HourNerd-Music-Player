name: Windows installers and release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the application version
        required: true
        default: v1.1.4
      publish:
        description: Publish a public prerelease after a successful build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v1.1.4' }}
  cancel-in-progress: false

jobs:
  installers:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v1.1.4' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release identity
        run: |
          $ErrorActionPreference = 'Stop'
          $assembly = Get-Content '.\HourNerdMusicPlayer\Properties\AssemblyInfo.cs' -Raw
          $match = [regex]::Match($assembly, 'AssemblyFileVersion\("(\d+\.\d+\.\d+)\.\d+"\)')
          if (!$match.Success) { throw 'Application version was not found.' }
          $version = $match.Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag must match the application version.' }
          "PRODUCT_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build application, tests, EXE and native MSI
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 was not found on the Windows runner.' }
          & '.\Build-Windows-Installers.ps1' -CompilerPath $compiler

      - name: Verify real MSI installation dialogs
        run: |
          & '.\rebuild\Test-MsiUi.ps1' -MsiPath ".\dist\HourNerd-Music-Player-$env:PRODUCT_VERSION-Setup.msi"

      - name: Retain validated audio repair DLL
        uses: actions/upload-artifact@v4
        with:
          name: HourNerd-Audio-Repair
          if-no-files-found: error
          retention-days: 14
          path: |
            HourNerdMusicPlayer/bin/Release/BassPlayer.dll
            Libs/BassPlayer/BassPlayer.cs

      - name: Prepare release assets
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $base = "HourNerd-Music-Player-$env:PRODUCT_VERSION"
          $sourcePath = Join-Path $PWD "dist\$base-Source.zip"
          $archive = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD "dist\$base-Windows.zip"))
          try {
            $entry = $archive.GetEntry('SOURCE.zip')
            if (!$entry) { throw 'Corresponding source was not packaged.' }
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $sourcePath, $true)
          } finally { $archive.Dispose() }
          $assets = @("dist\$base-Setup.exe", "dist\$base-Setup.msi", "dist\$base-Source.zip")
          foreach ($path in $assets) {
            if (!(Test-Path -LiteralPath $path)) { throw "Release asset missing: $path" }
          }
          $assets | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash, [IO.Path]::GetFileName($_)
          } | Set-Content 'dist\SHA256SUMS.txt' -Encoding ASCII

      - name: Retain installer downloads
        uses: actions/upload-artifact@v4
        with:
          name: HourNerd-Music-Player-${{ env.PRODUCT_VERSION }}-Installers
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*-Setup.exe
            dist/*-Setup.msi
            dist/*-Source.zip
            dist/*-Windows.zip
            dist/SHA256SUMS.txt

      - name: Retain build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-installer-build-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: dist/MSI-build-validation.log

      - name: Publish public GitHub prerelease
        # Paused: release must support ordinary Pandora account sign-in without end-user API setup.
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "HourNerd-Music-Player-$env:PRODUCT_VERSION"
          $assets = @("dist\$base-Setup.exe", "dist\$base-Setup.msi", "dist\$base-Source.zip", 'dist\SHA256SUMS.txt')
          & gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --prerelease --title "HourNerd Music Player $env:PRODUCT_VERSION" --notes-file 'installer\RELEASE-NOTES.md'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed. Existing release assets were not overwritten.' }
